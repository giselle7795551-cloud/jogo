
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#211b3b">
  <title>Gato Ninja: Fuga no Japão</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="container">
    <header class="cabecalho">
      <p class="subtitulo">UMA AVENTURA PIXEL ART</p>
      <h1>🐈‍⬛ Gato Ninja</h1>
      <p class="descricao">Fuga no Japão</p>
    </header>

    <section class="painel-jogo" aria-label="Cenário do jogo">
      <div class="hud">
        <span class="etiqueta">DISTÂNCIA</span>
        <span class="pontuacao">000000</span>
      </div>

      <div class="ceu">
        <div class="sol"></div>

        <div class="nuvem nuvem-1"></div>
        <div class="nuvem nuvem-2"></div>

        <div class="montanha montanha-1"></div>
        <div class="montanha montanha-2"></div>

        <div class="torii">
          <div class="torii-topo"></div>
          <div class="torii-meio"></div>
          <div class="torii-coluna coluna-1"></div>
          <div class="torii-coluna coluna-2"></div>
        </div>

        <div class="chao">
          <div class="linha-chao"></div>
          <div class="pedra pedra-1"></div>
          <div class="pedra pedra-2"></div>
          <div class="arbusto"></div>
        </div>

        <div class="gato" role="img" aria-label="Gato ninja preto">
          <div class="faixa"></div>
          <div class="orelha orelha-1"></div>
          <div class="orelha orelha-2"></div>
          <div class="cabeca">
            <div class="olho olho-1"></div>
            <div class="olho olho-2"></div>
            <div class="mascara"></div>
          </div>
          <div class="corpo"></div>
          <div class="rabo"></div>
          <div class="perna perna-1"></div>
          <div class="perna perna-2"></div>
        </div>
      </div>
    </section>

    <section class="instrucoes">
      <h2>Prepare-se, ninja!</h2>
      <p>
        Atravesse o Japão, desvie das pedras e arbustos
        e tente chegar o mais longe possível.
      </p>
      <div class="controles">
        <span class="tecla">ESPAÇO</span>
        <span class="ou">ou</span>
        <span class="tecla">↑</span>
        <span class="ou">ou toque na tela</span>
      </div>
      <p class="aviso">Os controles serão ativados na próxima etapa.</p>
    </section>

    <footer>
      <p>GATO NINJA <span>✦</span> AVENTURA NO JAPÃO</p>
    </footer>
  </main>
</body>
</html>
